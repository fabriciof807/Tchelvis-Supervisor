name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --locked --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mod tests
        run: |
          node --check assets/herdr-app/mods/tchelvis/main.js
          node --import ./tests/mod/stub-hooks.mjs --test tests/mod/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set build metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TCHELVIS_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TCHELVIS_CHANNEL=nightly" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=nightly" >> "$GITHUB_ENV"
          fi
          echo "TCHELVIS_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          strip "target/${{ matrix.target }}/release/tchelvis"

      - name: Package release archive and checksum
        run: |
          mkdir -p dist dist-stage
          cp "target/${{ matrix.target }}/release/tchelvis" dist-stage/tchelvis
          cp LICENSE-MIT LICENSE-APACHE README.md dist-stage/
          ASSET="tchelvis-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist-stage -czf "dist/${ASSET}" tchelvis LICENSE-MIT LICENSE-APACHE README.md
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined SHA256SUMS
        run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            awk -v ver="## [$VER]" '
              index($0, ver) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "Release ${TAG}" > notes.md
            fi
            gh release create "$TAG" \
              --title "Tchelvis $TAG" \
              --notes-file notes.md \
              dist/*
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Nightly" \
              --notes "commit ${GITHUB_SHA::7} · $(date -u +%F)" \
              dist/*
          fi
