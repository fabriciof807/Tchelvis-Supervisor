name = "fast-worker-reviewer"
description = "Implementa e revisa em ciclo rápido"
max_cycles = 3
stage_timeout_secs = 1800
stall_secs = 600
max_duration_secs = 7200

[[stages]]
id = "implement"
role = "worker"
reads = ["input.md", "review.md"]
edits = true
next = "review"

[[stages]]
id = "review"
role = "reviewer"
reads = ["input.md", "current.diff"]
writes = "review.md"
verdict_gate = true
on_pass = "done"
on_retry = "implement"
